name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: autobackup_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle
          
      - name: Build with Gradle
        run: |
          cd backend
          ./gradlew build --info
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/autobackup_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          
      - name: Run tests
        run: |
          cd backend
          ./gradlew test --info
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/autobackup_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          
      - name: Build Docker image
        run: |
          cd backend
          ./gradlew bootBuildImage --imageName=autobackup-api:latest
          
      - name: Push to Railway
        if: github.ref == 'refs/heads/main'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # TODO: Configure Railway deployment
          # - Install Railway CLI
          # - Authenticate with RAILWAY_TOKEN
          # - Deploy service
          echo "Deploy to Railway: TODO"

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          path: 'backend'
          format: 'JSON'
          
      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-report
          path: reports/
